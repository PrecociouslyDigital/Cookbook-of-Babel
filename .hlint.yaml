# hlint doesn't read default-extensions from the cabal files in babel/cabal.project;
# keep in sync.
- arguments:
    - -XGHC2021
    - -XDerivingStrategies
    - -XDuplicateRecordFields
    - -XLambdaCase
    - -XNoFieldSelectors
    - -XOverloadedRecordDot
    - -XOverloadedStrings

# Every import names what it takes, or is qualified.
- modules:
    - {name: '**', importStyle: explicitOrQualified}

# Babel.Model only re-exports its submodules, which needs open imports.
- ignore: {within: Babel.Model}
