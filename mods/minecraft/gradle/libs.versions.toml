# Every upstream version the mod builds against. Renovate opens PRs that bump
# these; CI then regenerates the datapack against the new versions.
[versions]
minecraft = "1.20.1"
# NeoForge 1.20.1 forked from Forge 47.1, so building against 47.1 keeps the
# jar loadable on both.
forge = "47.1.33"
parchment = "2023.09.03"
create = "6.0.8-291"
flywheel = "1.0.6"
ponder = "1.0.91"
registrate = "MC1.20-1.3.3"
farmersdelight = "1.20.1-1.3.4"
jei = "15.20.0.106"
garnished = "2.1.7.c+1.20.1-forge"
brewinandchewin = "1.20.1-3.2.1"
farmersrespite = "1.20.1-2.1"
vintagedelight = "0.1.6"
rats = "8.1.3"
citadel = "2.6.3"
pneumaticcraft = "6.0.23"
patchouli = "1.20.1-85-forge"
thermal-expansion = "11.0.1"
thermal-cultivation = "11.0.1"
thermal-foundation = "11.0.6"
cofh-core = "11.0.2"
theurgy = "1.20.1-1.30.0"
modonomicon = "1.20.1-1.79.3"
geckolib = "aC5KMoNg"  # Modrinth version ID for 4.8.4 on Forge 1.20.1; the same version number has separate IDs for Fabric and NeoForge
hexerei = "0.4.2.2"
# Modrinth version IDs, like geckolib's: the same version numbers name builds for other loaders and games.
sereneseasons = "WMrhrybF"  # 9.1.0.3 on Forge 1.20.1
glitchcore = "pYPZ5MNI"  # 0.0.1.1 on Forge 1.20.1
coldsweat = "FgspZiyS"  # 2.4.4 on Forge 1.20.1
# The Mixin that Forge 47 ships; only its annotation processor is a dependency.
mixin = "0.8.5"
jqwik = "1.9.3"
assertj = "3.26.3"
moddev = "2.0.148"

[libraries]
create = { module = "com.simibubi.create:create-1.20.1", version.ref = "create" }
flywheel-api = { module = "dev.engine-room.flywheel:flywheel-forge-api-1.20.1", version.ref = "flywheel" }
flywheel = { module = "dev.engine-room.flywheel:flywheel-forge-1.20.1", version.ref = "flywheel" }
ponder = { module = "net.createmod.ponder:Ponder-Forge-1.20.1", version.ref = "ponder" }
registrate = { module = "com.tterrag.registrate:Registrate", version.ref = "registrate" }
farmersdelight = { module = "maven.modrinth:farmers-delight", version.ref = "farmersdelight" }
jei-forge-api = { module = "mezz.jei:jei-1.20.1-forge-api", version.ref = "jei" }
jei-common-api = { module = "mezz.jei:jei-1.20.1-common-api", version.ref = "jei" }
jei-forge = { module = "mezz.jei:jei-1.20.1-forge", version.ref = "jei" }
garnished = { module = "maven.modrinth:create-garnished", version.ref = "garnished" }
brewinandchewin = { module = "maven.modrinth:brewin-and-chewin", version.ref = "brewinandchewin" }
farmersrespite = { module = "maven.modrinth:farmers-respite", version.ref = "farmersrespite" }
vintagedelight = { module = "maven.modrinth:vintage-delight", version.ref = "vintagedelight" }
rats = { module = "maven.modrinth:rats", version.ref = "rats" }
citadel = { module = "maven.modrinth:citadel", version.ref = "citadel" }
pneumaticcraft = { module = "maven.modrinth:pneumaticcraft-repressurized", version.ref = "pneumaticcraft" }
patchouli = { module = "maven.modrinth:patchouli", version.ref = "patchouli" }
thermal-expansion = { module = "maven.modrinth:thermal-expansion", version.ref = "thermal-expansion" }
thermal-cultivation = { module = "maven.modrinth:thermal-cultivation", version.ref = "thermal-cultivation" }
thermal-foundation = { module = "maven.modrinth:thermal-foundation", version.ref = "thermal-foundation" }
cofh-core = { module = "maven.modrinth:cofh-core", version.ref = "cofh-core" }
theurgy = { module = "maven.modrinth:theurgy", version.ref = "theurgy" }
modonomicon = { module = "maven.modrinth:modonomicon", version.ref = "modonomicon" }
geckolib = { module = "maven.modrinth:geckolib", version.ref = "geckolib" }
hexerei = { module = "maven.modrinth:hexerei", version.ref = "hexerei" }
sereneseasons = { module = "maven.modrinth:serene-seasons", version.ref = "sereneseasons" }
glitchcore = { module = "maven.modrinth:glitchcore", version.ref = "glitchcore" }
coldsweat = { module = "maven.modrinth:cold-sweat", version.ref = "coldsweat" }
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
moddev-legacyforge = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddev" }
