modLoader = "javafml"
loaderVersion = "[47,)"
license = "CC0-1.0 (code); the bundled recipe data is under the licences in LICENSE-data"
issueTrackerURL = "https://github.com/PrecociouslyDigital/Cookbook-of-Babel/issues"

[[mods]]
modId = "cookbook_of_babel"
version = "${version}"
displayName = "Cookbook of Babel"
description = '''
Real recipes from the Cookbook of Babel dataset, cooked in the machines of Create, Farmer's Delight and vanilla.
'''

[[dependencies.cookbook_of_babel]]
modId = "forge"
mandatory = true
versionRange = "[47.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.cookbook_of_babel]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft}]"
ordering = "NONE"
side = "BOTH"

